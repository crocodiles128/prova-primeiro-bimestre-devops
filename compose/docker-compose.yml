services:
  postgres:
    image: postgres:15-alpine
    container_name: technova-postgres
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - technova-net

  redis:
    image: redis:7-alpine
    container_name: technova-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - technova-net

  api:
    build:
      context: ../app
      dockerfile: Dockerfile
    container_name: technova-api
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: ${PORT}
      APP_ENV: ${APP_ENV}
      DATABASE_URL: ${DATABASE_URL}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "3000:3000"
    networks:
      - technova-net

volumes:
  pgdata:

networks:
  technova-net:
    driver: bridge
